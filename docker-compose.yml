# Chronos — local docker-compose for the hackathon demo
#
#   docker compose up --build
#
# Brings up:
#   - chronos-orchestrator  (FastAPI on :8080)
#   - chronos-broker        (Go A2A server on :8081)
#   - chronos-dashboard     (Streamlit on :8501)
#
# Without GCP credentials, the orchestrator and broker run with in-memory
# state. The wire protocols and structural guarantees are unchanged.

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: chronos-orchestrator
    ports: ["8080:8080"]
    environment:
      CHRONOS_BROKER_URL: "http://broker:8081"
    depends_on: [broker]

  broker:
    build:
      context: .
      dockerfile: Dockerfile.broker
    container_name: chronos-broker
    ports: ["8081:8080"]
    environment:
      CHRONOS_BROKER_ADDR: ":8080"

  dashboard:
    image: python:3.11-slim
    container_name: chronos-dashboard
    working_dir: /app
    volumes: [".:/app"]
    command: >
      sh -c "pip install --quiet streamlit httpx &&
             streamlit run apps/dashboard/streamlit_app.py
                   --server.port 8501 --server.address 0.0.0.0"
    ports: ["8501:8501"]
    depends_on: [orchestrator]
    environment:
      CHRONOS_API_URL: "http://orchestrator:8080"